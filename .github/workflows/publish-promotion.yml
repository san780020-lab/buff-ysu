name: 发布每日宣传
on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 要重新发布的宣传 Issue 编号
        required: true
        type: string
permissions:
  contents: write
  issues: read
  pages: write
concurrency:
  group: publish-promotion
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.actor == github.repository_owner &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[每日宣传]')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: 同步宣传并请求网站更新
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_promotion.py
